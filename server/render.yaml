services:
  - type: web
    name: replayx-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DATABASE_NAME
        value: webhook_intelligence
      - key: ALLOWED_ORIGINS
        sync: false
